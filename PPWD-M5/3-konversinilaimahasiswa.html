<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>\Program Konversi Nilai Mahasiswa Sederhana</title>
</head>
<body>

<h2>Konversi Nilai Mahasiswa Sederhana</h2>

<input type="number" id="inputNilai" placeholder="Masukkan Nilai (0-100)"><button onclick="konversiNilai()">Konversi</button>

<p id="idTarget"></p>

<script>
function konversiNilai() {
    let nilai = Number(document.getElementById('inputNilai').value);
    let grade = '';

    if (nilai >= 90 && nilai <= 100) {
        grade = "Grade A"
    } else if (nilai >= 80 && nilai <= 89) {
        grade = "Grade B"
    } else if (nilai >= 70 && nilai <= 79) {
        grade = "Grade C"
    } else if (nilai >= 60 && nilai <= 69) {
        grade = "Grade D"
    } else if (nilai >= 0 && nilai < 60) {
        grade = "Grade E"    
    } else {
        grade = 'Nilai tidak valid! Masukkan angka 0-100!'
    }

    document.getElementById('idTarget').innerHTML = "Nilai: " + nilai + " --> " + "<br>Grade: " + grade;
}
</script>

</body>
</html>

  font-family: 'Segoe UI', Arial, sans-serif;
