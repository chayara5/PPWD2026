<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tugas 1 - Konversi Suhu</title>
<style>
  body { font-family: Arial; text-align: center; padding: 40px; background: #f0f2f5; }
  .container { background: white; padding: 30px; border-radius: 12px; max-width: 420px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  input { padding: 10px; width: 80%; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
  button { padding: 10px 25px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
  button:hover { background: #1a252f; }
  .hasil { margin-top: 20px; padding: 15px; background: #eaf2f8; border-radius: 6px; text-align: left; }
  .error { background: #fdecea; color: #c0392b; }
</style>
</head>
<body>
<div class="container">
  <h2>🌡️ Konversi Suhu Celcius -> Suhu Farenheit & Kelvin</h2>
  <input type="text" id="celcius" placeholder="Masukkan suhu (°C)">
  <button onclick="konversiSuhu()">Konversi</button>
  <div class="hasil" id="hasil">Masukkan suhu lalu klik tombol Konversi</div>
</div>

<script>
function konversiSuhu() {
  let inputC = document.getElementById("celcius").value;

  if (inputC === "") {
    document.getElementById("hasil").innerHTML = "❌ Input tidak boleh kosong!";
    document.getElementById("hasil").className = "hasil error";
    return;
  }

  let celcius = parseFloat(inputC);

  if (isNaN(celcius)) {
    document.getElementById("hasil").innerHTML = "❌ Input harus berupa angka!";
    document.getElementById("hasil").className = "hasil error";
    return;
  }

  let fahrenheit = (celcius * 9/5) + 32;
  let kelvin = celcius + 273.15;

  document.getElementById("hasil").className = "hasil";
  document.getElementById("hasil").innerHTML =
    "🌡️ " + celcius + "°C = <strong>" + fahrenheit.toFixed(2) + "°F</strong><br>" +
    "🌡️ " + celcius + "°C = <strong>" + kelvin.toFixed(2) + "K</strong>";
}
</script>
</body>
</html>
